overrides:
  # glob 7 and readdir-glob ask for minimatch 3 and 5, below the range override; these keep them on the patched releases.
  'glob@7>minimatch': 3.1.5
  'readdir-glob>minimatch': 5.1.9
  # Advisories with no patched release on the major the dependents ask for. Each override is scoped to the
  # vulnerable range, so a package on an unaffected major keeps it.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  'glob@>=9.0.0 <=14.0.1': ^14.0.2
  'uuid@<11.1.1': ^11.1.1
allowBuilds:
  '@firebase/util': true
  protobufjs: true
