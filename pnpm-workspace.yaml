  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  'glob@>=9.0.0 <=14.0.1': ^14.0.2
  'uuid@<11.1.1': ^11.1.1
  '@opentelemetry/core@<2.8.0': ^2.8.0
allowBuilds:
  '@firebase/util': true
  protobufjs: true
