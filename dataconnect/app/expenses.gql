}

# Changes the description only and records EXPENSE_UPDATE.
mutation UpdateExpense($id: UUID!, $description: String!, $activityId: UUID!)
@auth(
  expr: "auth != null && auth.token.firebase.sign_in_provider != 'anonymous' && vars.description.size() <= 500"
)
@transaction {
  query @redact {
    expense(
      first: {
        where: {
          id: { eq: $id }
          group: {
            groupMembers_on_group: {
              exist: { userId: { eq_expr: "auth.uid" } }
            }
          }
        }
      }
    ) @check(expr: "this != null", message: "Not found") {
      groupId
      amount
    }
  }
  expense_update(
    key: { id: $id }
    data: { description: $description, updatedAt_expr: "request.time" }
  )
  activity_insert(
    data: {
      id: $activityId
      type: EXPENSE_UPDATE
      actorId_expr: "auth.uid"
      groupId_expr: "response.query.expense.groupId"
      expenseId: $id
      amount_expr: "response.query.expense.amount"
      title: $description
    }
  )
}

# Records EXPENSE_MINUS with the expense's description and amount, then deletes the expense with its payments and
# splits. The activity row stays: it does not reference the expense.
mutation DeleteExpense($id: UUID!, $activityId: UUID!)
@auth(
  expr: "auth != null && auth.token.firebase.sign_in_provider != 'anonymous'"
)
@transaction {
  query @redact {
    expense(
      first: {
        where: {
          id: { eq: $id }
          group: {
            groupMembers_on_group: {
              exist: { userId: { eq_expr: "auth.uid" } }
            }
          }
        }
      }
    ) @check(expr: "this != null", message: "Not found") {
      groupId
      amount
      description
    }
  }
  activity_insert(
    data: {
      id: $activityId
      type: EXPENSE_MINUS
      actorId_expr: "auth.uid"
      groupId_expr: "response.query.expense.groupId"
      expenseId: $id
      amount_expr: "response.query.expense.amount"
      title_expr: "response.query.expense.description"
    }
  )
  userPayment_deleteMany(where: { expenseId: { eq: $id } })
  userSplit_deleteMany(where: { expenseId: { eq: $id } })
  expense_delete(key: { id: $id })
}
