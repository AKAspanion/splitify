# Reads, edits and deletes of an expense. Each is limited to members of the expense's group; an expense the caller
# may not see answers as a missing one: null from a query, "Not found" from a mutation. The group of an edit or a
# delete comes from the expense, never from the variables.

query GetExpense($id: UUID!)
@auth(
  expr: "auth != null && auth.token.firebase.sign_in_provider != 'anonymous'"
) {
  expense(
    first: {
      where: {
        id: { eq: $id }
        group: {
          groupMembers_on_group: { exist: { userId: { eq_expr: "auth.uid" } } }
        }
      }
    }
  ) {
    id
    amount
    currency
    description
    category
    type
    tag
    groupId
    createdAt
    updatedAt
    creator {
      id
      name
      email
    }
    payments: userPayments_on_expense {
      user {
        id
        name
        email
      }
      amount
    }
    splits: userSplits_on_expense {
      user {
        id
        name
        email
      }
      amount
      percent
    }
  }
}

query ListGroupExpenses(
  $groupId: UUID!
  $limit: Int!
  $offset: Int!
  $search: String
)
@auth(
  expr: "auth != null && auth.token.firebase.sign_in_provider != 'anonymous' && vars.limit <= 100 && (!has(vars.search) || vars.search == null || vars.search.size() <= 100)"
) {
  expenses(
    where: {
      groupId: { eq: $groupId }
      description: { pattern: { regex: $search, ignoreCase: true } }
      group: {
        groupMembers_on_group: { exist: { userId: { eq_expr: "auth.uid" } } }
      }
    }
    orderBy: [{ createdAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    amount
    currency
    description
    category
    type
    tag
    createdAt
    creator {
      id
      name
    }
  }
  total: expenses(
    where: {
      groupId: { eq: $groupId }
      description: { pattern: { regex: $search, ignoreCase: true } }
      group: {
        groupMembers_on_group: { exist: { userId: { eq_expr: "auth.uid" } } }
      }
    }
  ) {
    count: _count
  }
}

query GetGroupLedger($groupId: UUID!)
@auth(
  expr: "auth != null && auth.token.firebase.sign_in_provider != 'anonymous'"
) {
  expenses(
    where: {
      groupId: { eq: $groupId }
      group: {
        groupMembers_on_group: { exist: { userId: { eq_expr: "auth.uid" } } }
      }
    }
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    amount
    description
    tag
    type
    createdAt
    payments: userPayments_on_expense {
      user {
