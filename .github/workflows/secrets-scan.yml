name: Secret scan

# TruffleHog OSS (AGPL, no licence key) looks for credentials in the commits each event brings: a pull request's
# commits, a push's commits, and once a week the whole history of every branch. It fails only on a credential it
# verified against its provider, so a test fixture or a placeholder doesn't fail the run.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the scan can walk from the base commit, or every commit on the weekly run.
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          # The action runs the image tagged by `version`, `latest` by default: pin the release and its digest too.
          # Raise both with the action's SHA above.
          version: 3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
          extra_args: --results=verified
