name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, unit + rules tests, audits, functions build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # --ignore-scripts: postinstall runs `prisma db push`, which CI must not do.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Install Cloud Functions dependencies
        run: yarn --cwd functions install --frozen-lockfile
      - run: npx prisma generate
      - run: yarn dataconnect:generate
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn test
      - name: SQL Connect rules tests
        run: yarn test:rules
      - name: Hosting build
        # The public pages export to out/ and are served by the Hosting emulator.
        env:
          NEXT_PUBLIC_GOOGLE_ADSENSE_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_ID }}
          NEXT_PUBLIC_ONE_SIGNAL_APP_ID: ${{ vars.NEXT_PUBLIC_ONE_SIGNAL_APP_ID }}
          NEXT_PUBLIC_ONE_SIGNAL_SAFARI_WEB_ID: ${{ vars.NEXT_PUBLIC_ONE_SIGNAL_SAFARI_WEB_ID }}
        run: |
          yarn build:hosting
          yarn check:hosting
      - name: Audit shipped dependencies
        run: |
          # yarn 1 exits with a bitmask of every severity found (high 8, critical 16),
          # whatever --level says, so fail only when one of those two bits is set.
          code=0
          yarn audit --groups dependencies --level high || code=$?
          if [ $((code & 24)) -ne 0 ]; then
            echo "::error::yarn audit found high or critical advisories (exit code $code)"
            exit 1
          fi
          exit 0
      - name: Build Cloud Functions
        run: yarn --cwd functions build
      - name: Audit Cloud Functions dependencies
        run: |
          # yarn 1 exits with a bitmask of every severity found (high 8, critical 16),
          # whatever --level says, so fail only when one of those two bits is set.
          code=0
          yarn --cwd functions audit --groups dependencies --level high || code=$?
          if [ $((code & 24)) -ne 0 ]; then
            echo "::error::yarn audit found high or critical advisories in functions (exit code $code)"
            exit 1
          fi
          exit 0
