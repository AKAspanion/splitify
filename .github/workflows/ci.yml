name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, types, unit + rules tests, audits, functions build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            functions/pnpm-lock.yaml
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # --ignore-scripts: the SQL Connect SDK is generated by its own step below.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Cloud Functions dependencies
        run: pnpm functions:install
      - run: pnpm dataconnect:generate
      - name: Check formatting
        run: pnpm prettier --check .
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm test
      - name: SQL Connect rules tests
        run: pnpm test:rules
      - name: Build
        # The whole site exports to out/ and is served by the Hosting emulator.
        env:
          NEXT_PUBLIC_GOOGLE_ADSENSE_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'demo-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'demo-splitify.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'demo-splitify' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:0:web:0' }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY || 'demo-vapid-key' }}
        run: |
          pnpm build
          pnpm check:hosting
      # Every dependency, development ones included: the moderate advisories this gate now catches were in tooling.
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
      - name: Build Cloud Functions
        run: pnpm functions:build
      - name: Audit Cloud Functions dependencies
        run: pnpm --dir functions audit --audit-level moderate

  dependency-review:
    name: Dependency review
    # It compares the pull request's base and head, so it has nothing to compare when deploy.yml calls CI on a push.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The Playwright config starts the emulators (project demo-splitify) and the site itself, so the job reads no
    # repository secret or variable.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            functions/pnpm-lock.yaml
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # --ignore-scripts: the SQL Connect SDK is generated by its own step below.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Cloud Functions dependencies
        run: pnpm functions:install
      - run: pnpm dataconnect:generate
      # The Functions emulator loads the compiled functions from functions/lib.
      - name: Build Cloud Functions
        run: pnpm functions:build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
